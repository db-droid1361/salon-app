<!doctype html>
<html lang="fa" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه مدیریت سالن‌ها | واحد تولید محتوا، رسانه و مستندسازی</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
<style>
/* ============ DESIGN TOKENS ============ */
:root{
  --bg:#f4f6f9; --bg-2:#eef1f6;
  --surface:#ffffff; --surface-2:#fafbfc; --surface-3:#f3f5f8;
  --border:#e5e8ee; --border-2:#d5dae2;
  --ink:#0f172a; --ink-2:#334155; --muted:#64748b; --muted-2:#94a3b8;
  --brand:#4f46e5; --brand-2:#4338ca; --brand-soft:#eef2ff; --brand-soft-2:#e0e7ff;
  --green:#059669; --green-soft:#d1fae5;
  --amber:#d97706; --amber-soft:#fef3c7;
  --red:#dc2626; --red-soft:#fee2e2;
  --blue:#2563eb; --blue-soft:#dbeafe;
  --indigo:#6366f1; --indigo-soft:#e0e7ff;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:22px;
  --sh-xs:0 1px 2px rgba(15,23,42,.04);
  --sh-sm:0 1px 3px rgba(15,23,42,.08),0 1px 2px -1px rgba(15,23,42,.06);
  --sh-md:0 4px 6px -1px rgba(15,23,42,.08),0 2px 4px -2px rgba(15,23,42,.05);
  --sh-lg:0 10px 15px -3px rgba(15,23,42,.08),0 4px 6px -4px rgba(15,23,42,.04);
  --sh-xl:0 20px 25px -5px rgba(15,23,42,.12),0 8px 10px -6px rgba(15,23,42,.06);
  --ease:cubic-bezier(.4,0,.2,1);
  --tr:180ms var(--ease);
}
[data-theme="dark"]{
  --bg:#0b0e14; --bg-2:#0f131a;
  --surface:#161a22; --surface-2:#1c212b; --surface-3:#222834;
  --border:#262c38; --border-2:#333a48;
  --ink:#f1f5f9; --ink-2:#cbd5e1; --muted:#94a3b8; --muted-2:#64748b;
  --brand:#818cf8; --brand-2:#6366f1; --brand-soft:#1e1b4b; --brand-soft-2:#312e81;
  --green:#34d399; --green-soft:#064e3b;
  --amber:#fbbf24; 
--amber-soft:#78350f;
  --red:#f87171; --red-soft:#7f1d1d;
  --blue:#60a5fa; --blue-soft:#1e3a8a;
  --indigo:#a5b4fc; --indigo-soft:#312e81;
  --sh-xs:0 1px 2px rgba(0,0,0,.3);
  --sh-sm:0 1px 3px rgba(0,0,0,.4);
  --sh-md:0 4px 6px rgba(0,0,0,.4);
  --sh-lg:0 10px 15px rgba(0,0,0,.5);
  --sh-xl:0 20px 25px rgba(0,0,0,.55);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Vazirmatn',system-ui,-apple-system,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-h
eight:1.65;transition:background var(--tr),color var(--tr);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:14px;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand);text-decoration:none}
::selection{background:var(--brand);color:#fff}
.hidden{display:none!important}

/* ============ APP SHELL ============ */
.app{display:flex;min-height:100vh;background:var(--bg)}
.sidebar{width:264px;flex-s
hrink:0;background:var(--surface);border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:sticky;top:0;transition:transform var(--tr);z-index:50}
.sidebar-head{padding:20px 18px 16px;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{width:42px;height:42px;border-radius:12px;flex-shrink:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;box-shadow:0 6px 14px -4px rgba(79,70,229,.5)}
.brand-mark 
svg{width:22px;height:22px}
.brand-text strong{display:block;font-size:15px;font-weight:800;letter-spacing:-.2px}
.brand-text small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.sidebar-nav{flex:1;overflow-y:auto;padding:12px 10px}
.sidebar-nav::-webkit-scrollbar{width:5px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border-2);border-radius:4px}
.nav-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;margin-bottom:2px;border-radius:10px;col
or:var(--ink-2);font-weight:600;font-size:13.5px;transition:all var(--tr);position:relative}
.nav-item svg{width:18px;height:18px;flex-shrink:0;stroke-width:2;opacity:.75}
.nav-item:hover{background:var(--surface-3);color:var(--ink)}
.nav-item:hover svg{opacity:1}
.nav-item.active{background:var(--brand);color:#fff;box-shadow:0 6px 14px -6px var(--brand)}
.nav-item.active svg{opacity:1;color:#fff}
.sidebar-foot{padding:14px;border-top:1px solid var(--border)}
.version-chip{font-size:11px;color:var(--muted);text-align:center;padd
ing:8px;background:var(--surface-3);border-radius:8px;display:flex;align-items:center;justify-content:center;gap:6px}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-soft);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.main-wrapper{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 24px
;position:sticky;top:0;z-index:40}
[data-theme="dark"] .topbar{background:rgba(22,26,34,.85)}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:14px}
.breadcrumb .crumb-root{color:var(--muted);font-weight:500}
.breadcrumb .crumb-sep{color:var(--muted-2)}
.breadcrumb .crumb-current{font-weight:800;color:var(--ink)}
.topbar-actions{margin-right:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2);background:transparent;transition:all var(--tr);border:1px solid 
transparent}
.icon-btn:hover{background:var(--surface-3);color:var(--ink);border-color:var(--border)}
.icon-btn svg{width:18px;height:18px;stroke-width:2}
.content{padding:24px;max-width:1400px;width:100%;animation:fadeUp .35s var(--ease)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);z-index:45}
.overlay.active{display:block}

/* ============ CARDS ============ */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:24px;margin-bottom:20px;box-shadow:var(--sh-sm);transition:box-shadow var(--tr)}
.card:hover{box-shadow:var(--sh-md)}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.card-head h2,.card h2{font-size:17px;font-weight:800;display:flex;align-items:center;gap:10px;letter-spacing:-.3px}
.card-head h3,.card h3{font-size:15px;font-weight:700;display:flex;alig
n-items:center;gap:8px}
.card-title-icon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex-shrink:0}
.card-title-icon svg{width:18px;height:18px;stroke-width:2}

/* ============ STATS ============ */
.grid-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.stat{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;transition:all 
var(--tr)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-lg);border-color:var(--border-2)}
.stat-inner{position:relative;display:flex;flex-direction:column;gap:10px}
.stat-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stat-label{font-size:12.5px;color:var(--muted);font-weight:600}
.stat-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--tint-soft,var(--brand-soft));color:var(--tint,var(--brand))}
.stat-icon svg{width:18px;height:18px;stroke-width:2}
.stat-value{font-size:28px;font-weight:800;color:var(--ink);line-height:1;letter-spacing:-1px}
.stat--brand{--tint:var(--brand);--tint-soft:var(--brand-soft)}
.stat--green{--tint:var(--green);--tint-soft:var(--green-soft)}
.stat--amber{--tint:var(--amber);--tint-soft:var(--amber-soft)}
.stat--red{--tint:var(--red);--tint-soft:var(--red-soft)}
.stat--blue{--tint:var(--blue);--tint-soft:var(--blue-soft)}

/* ============ BUTTONS ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-rad
ius:10px;font-weight:700;font-size:13.5px;transition:all var(--tr);white-space:nowrap;border:1px solid transparent}
.btn svg{width:16px;height:16px;stroke-width:2.2}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 4px 12px -4px var(--brand)}
.btn-primary:hover{background:var(--brand-2);transform:translateY(-1px);box-shadow:0 6px 16px -4px var(--brand)}
.btn-secondary{background:var(--surface);color:var(--ink);border-color:var(--border-2)}
.btn-secondary:hover{background:var(--surface-3);border-color:var(--muted-2)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{filter:brightness(.92)}
.btn-ghost{color:var(--muted)}
.btn-ghost:hover{background:var(--surface-3);color:var(--ink)}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-sm svg{width:14px;height:14px}

/* ============ FORMS ============ */
.field{flex:1;min-width:180px}
.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:600}
.req{color:var(--red);margin-right:3
px;font-weight:900}
input,select,textarea{width:100%;border:1px solid var(--border-2);border-radius:10px;padding:11px 14px;background:var(--surface);color:var(--ink);transition:all var(--tr);font-size:13.5px}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input:hover,select:hover,textarea:hover{border-color:var(--muted-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
textarea{min-height:88px;resize:vertical;line-height:1.6}
input[type="checkbox"]{width:auto;accent-color:var(--bran
d);transform:scale(1.1)}
input:invalid:not(:placeholder-shown),select:invalid{border-color:var(--red)}
input:invalid:not(:placeholder-shown):focus,select:invalid:focus{box-shadow:0 0 0 4px var(--red-soft)}
.row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:16px}
.row:last-child{margin-bottom:0}
.checkline{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:all var(--tr);font-size:13px;background:var(--surface)}
.checkline:hover{border-color:var(-
-brand);background:var(--brand-soft)}
.checkline:has(input:checked){border-color:var(--brand);background:var(--brand-soft);color:var(--brand-2);font-weight:700}

/* ============ TABLE ============ */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:right;padding:13px 16px;border-bottom:1px solid var(--border);vertical-align:middle;word-break:break-word}
th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:11.5px;white-space:nowrap;text-transform:uppercase;letter-spacing:.4px}
tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--tr)}
tbody tr:hover{background:var(--surface-2)}
td.actions-cell{white-space:nowrap}

/* ============ BADGES ============ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11.5px;font-weight:700;white-space:
nowrap}
.badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
.b-approved{background:var(--blue-soft);color:var(--blue)}
.b-confirmed{background:var(--green-soft);color:var(--green)}
.b-cancelled{background:var(--red-soft);color:var(--red)}
.b-done{background:var(--indigo-soft);color:var(--indigo)}

/* ============ ALERTS & EMPTY ============ */
.notice{padding:13px 16px;background:var(--blue-soft);border-radius:var(--r);margin:16px 0;color:var(--blue);font-size:13.5px
;display:flex;gap:10px;align-items:flex-start}
.notice svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;stroke-width:2}
.alert-danger{padding:13px 16px;background:var(--red-soft);border-radius:var(--r);margin:16px 0;color:var(--red);font-size:13.5px;font-weight:600;display:flex;gap:10px;align-items:flex-start}
.alert-danger svg{width:18px;height:18px;flex-shrink:0;margin-top:1px;stroke-width:2}
.empty{text-align:center;padding:56px 24px;color:var(--muted);background:var(--surface-2);border-radius:var(--r);border:1px dashed var(--border-2)}
.empty svg{width:48px;height:48px;opacity:.35;margin-bottom:12px;stroke-width:1.5}
.empty h4{font-size:15px;color:var(--ink-2);margin-bottom:4px;font-weight:700}
.empty p{font-size:13px}

/* ============ DATE PICKER ============ */
.pdate-input{cursor:pointer;background:var(--surface-2);text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.pdate-input:hover{background:var(--surface-3)}
.pdate-overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);backdrop-filter:blur(6p
x);display:flex;justify-content:center;align-items:center;z-index:9999;animation:fadeUp .2s var(--ease);padding:12px}
.pdate-box{background:var(--surface);padding:22px;border-radius:var(--r-xl);box-shadow:var(--sh-xl);width:400px;max-width:100%;border:1px solid var(--border);animation:zoomIn .2s var(--ease)}
@keyframes zoomIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
.pdate-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:8px;flex-wrap:wrap}
.pdate-selects{display:flex;gap:8px;
flex:1;min-width:0}
.pdate-selects select{padding:8px 10px;border-radius:8px;font-weight:700;font-size:13px;background:var(--surface-3);min-width:0}
.pdate-nav-btn{background:var(--surface-3);color:var(--ink);width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font-size:15px;transition:all var(--tr);font-weight:700;flex-shrink:0}
.pdate-nav-btn:hover{background:var(--brand);color:#fff}
.pdate-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.pdate-weekday{font-size:11px;color:var(--muted);padding:6px;font-weight:700}
.pdate-day{padding:9px 0;border-radius:9px;cursor:pointer;font-size:14px;font-weight:600;transition:all var(--tr);font-variant-numeric:tabular-nums}
.pdate-day:hover{background:var(--brand-soft);color:var(--brand)}
.pdate-day.today{border:1.5px solid var(--brand);color:var(--brand)}
.pdate-day.selected{background:var(--brand);color:#fff;box-shadow:0 4px 10px -3px var(--brand)}
.pdate-day.past{color:var(--muted-2);cursor:not-allowed;opacity:.45;pointer-events:none}
.pdate-day.holiday{color:var(--red)}
.pdate-day.holiday.selected{color:#fff}
.pdate-actions{display:flex;ju
stify-content:space-between;margin-top:18px;padding-top:16px;border-top:1px solid var(--border);gap:10px}

/* ============ TOAST ============ */
.toast-container{position:fixed;bottom:24px;left:24px;z-index:10000;display:flex;flex-direction:column;gap:10px;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);padding:12px 16px;border-radius:12px;box-shadow:var(--sh-lg);min-width:280px;max-width:400px;opacity:0;transform:translateY(16px);transition:all .3s 
var(--ease);pointer-events:auto;font-size:13.5px;font-weight:600}
.toast.show{opacity:1;transform:translateY(0)}
.toast-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;flex-shrink:0}
.toast-icon svg{width:16px;height:16px;stroke-width:2.5}
.toast-success .toast-icon{background:var(--green-soft);color:var(--green)}
.toast-error .toast-icon{background:var(--red-soft);color:var(--red)}
.toast-warning .toast-icon{background:var(--amber-soft);color:var(--amber)}
.toast-info .toast-icon{background:var(--blue-soft);color:var(--blue)}
.toast-msg{flex:1;line-height:1.5;color:var(--ink-2)}

/* ============ CALENDAR (TABLE-BASED) ============ */
.cal-table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--border);background:var(--surface)}
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal-table th{background:var(--surface-2);color:var(--muted);font-weight:700;font-size:12.5px;padding:10px 4px;text-align:center;border:1px solid var(--border);border-top:none}
.cal-table td{border:1px solid 
var(--border);vertical-align:top;padding:6px;height:96px;background:var(--surface)}
.cal-table td.cal-empty{background:var(--surface-2);opacity:0.5}
.cal-table td.today{background:var(--brand-soft);border:1.5px solid var(--brand)}
.cal-table td.holiday .cal-day-num{color:var(--red)}
.cal-day-num{display:block;font-size:14px;font-weight:800;margin-bottom:4px}
.cal-event{font-size:10.5px;padding:3px 5px;border-radius:5px;background:var(--brand-soft);color:var(--brand-2);margin-top:4px;border-right:2px solid var(--brand);overflow:hidden;
text-overflow:ellipsis;white-space:nowrap}

/* ============ SYNC INDICATOR ============ */
.sync-badge{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;color:var(--muted);font-weight:600;padding:4px 9px;border-radius:20px;background:var(--surface-3);border:1px solid var(--border)}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted-2);transition:all var(--tr)}
.sync-badge.online .sync-dot{background:var(--green);box-shadow:0 0 0 3px 
var(--green-soft);animation:pulse 2s infinite}
.sync-badge.offline .sync-dot{background:var(--amber)}
.sync-badge.syncing .sync-dot{background:var(--blue);animation:pulse 1s infinite}

/* ============ AUTH / LOGIN SCREEN ============ */
.auth-screen{position:fixed;inset:0;background:linear-gradient(135deg,var(--brand-soft),var(--bg-2));display:grid;place-items:center;z-index:200;padding:20px;animation:fadeUp .4s var(--ease);overflow-y:auto}
.auth-card{background:var(--surface);padding:36px 32px;border-radius:var(--r-xl);box
-shadow:var(--sh-xl);width:400px;max-width:100%;border:1px solid var(--border);animation:zoomIn .25s var(--ease);margin:auto}
.auth-logo{display:flex;flex-direction:column;align-items:center;gap:14px;margin-bottom:24px;text-align:center}
.auth-logo-mark{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;color:#fff;box-shadow:0 12px 28px -8px var(--brand)}
.auth-logo-mark svg{width:28px;height:28px}
.auth-logo h1{font-size:18px;font-weight:800;letter-spacing:-.3px}
.auth-logo p{font-size:12.5px;color:var(--muted);line-height:1.5}
.auth-form{display:flex;flex-direction:column;gap:14px}
.auth-form .field{margin-bottom:0}
.auth-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:12.5px}
.auth-link{color:var(--brand);font-weight:700;cursor:pointer;transition:color var(--tr)}
.auth-link:hover{text-decoration:underline;color:var(--brand-2)}
.auth-error{padding:11px 14px;background:var(--red-soft);color:var(--red);border-radius:10px;font-size:13px;font-weight:600;di
splay:none;animation:fadeUp .2s var(--ease)}
.auth-error.show{display:block}
.auth-success-notice{padding:11px 14px;background:var(--green-soft);color:var(--green);border-radius:10px;font-size:13px;font-weight:600;margin-bottom:14px;display:flex;gap:8px;align-items:flex-start}
.auth-success-notice svg{width:16px;height:16px;flex-shrink:0;margin-top:2px}

/* ============ USER CHIP & PERMISSIONS ============ */
.user-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px 5px 6px;border-radius:22px;backgro
und:var(--surface-3);border:1px solid var(--border);font-size:12.5px;font-weight:700;cursor:default;transition:all var(--tr)}
.user-chip:hover{border-color:var(--brand)}
.user-chip .avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--indigo));display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.user-chip .role-tag{font-size:10.5px;padding:2px 7px;border-radius:12px;background:var(--brand-soft);color:var(--brand-2);margin-right:2px}

.permission-grid{display:grid;
grid-template-columns:repeat(2,1fr);gap:10px;margin:8px 0 16px}
.perm-card{padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);display:flex;align-items:center;gap:10px;transition:all var(--tr);cursor:pointer}
.perm-card:hover{border-color:var(--brand-2)}
.perm-card:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.perm-card:has(input:disabled){opacity:.5;cursor:not-allowed}
.perm-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--b
rand-soft);color:var(--brand);flex-shrink:0}
.perm-icon svg{width:15px;height:15px}
.perm-info{flex:1;min-width:0}
.perm-info strong{display:block;font-size:12.5px;font-weight:700}
.perm-info small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.perm-card input[type=checkbox]{width:auto;transform:scale(1.15)}

.pending-requests-banner{padding:14px 16px;background:var(--amber-soft);border:1px solid var(--amber);border-right:3px solid var(--amber);border-radius:var(--r);margin-bottom:18px}
.pending-requests-banner h4{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:800;color:var(--amber);margin-bottom:10px}
.pending-requests-banner h4 svg{width:16px;height:16px}
.pending-requests-banner .req-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--surface);border-radius:8px;margin-bottom:6px;font-size:12.5px;flex-wrap:wrap}
.pending-requests-banner .req-item:last-child{margin-bottom:0}
.pending-requests-banner .req-item small{display:block;color:var(--muted);font-size:11px;margin-top:2px}

.password-display{padding:14px;background:var(--brand-soft);border:1px dashed var(--brand);border-radius:var(--r);margin:12px 0;text-align:center;font-family:monospace;font-size:18px;font-weight:800;color:var(--brand-2);letter-spacing:1px;user-select:all;direction:ltr;word-break:break-all}

/* ============ PRINT ============ */
#printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block!important;position:absolute;inset:0
;width:100%;padding:24px;background:#fff;color:#000}
  .sidebar,.topbar,.overlay,.pdate-overlay,.toast-container,.no-print{display:none!important}
  .print-form{border:2px solid #111;padding:24px;border-radius:0}

  .print-form h4{margin:18px 0 8px;font-size:14px}
  .print-info-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:12px}
  .print-info-table td{border:1px solid #444;padding:8px 10px}

x;gap:20px}

<script>
/* ============ TOAST ============ */
function toast(msg,type='info',duration=3800){
  const c=document.getElementById('toastContainer');
  const el=document.createElement('div');
  const icon=type==='success'?IC.check:type==='error'?IC.x:type==='warning'?IC.warn:IC.info;
  el.className=`toast toast-${type}`;
  el.innerHTML=`<div class="toast-icon">${icon}</div><div class="toast-msg">${esc(msg)}</div>`;
  c.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{el.classList.remove('show');setTimeout(()=>el.remove(),320)},duration);
}
window.alert=function(msg){
  const m=String(msg);
  const type=/خطا|ناموفق|نامعتبر|تداخل|تکمیل|مسدود/.test(m)?'error':/موفق|انجام شد|ثبت شد|افزوده|ویرایش|حذف|سینک/.test(m)?'success':'info';
  toast(m,type);
};

/* ============ THEME ============ */
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme');
  const next=cur==='dark'?'light':'dark';
  document.documentElement.setAttribute('data-theme',next);
  try{localStorage.setItem('hall_theme',next)}catch(e){}

/* ============ HELPERS ============ */
function toEnglishDigits(str){
  if(str==null) return '';
  return String(str)
    .replace(/[۰-۹]/g, c=>c.charCodeAt(0)-1776)
    .replace(/[٠-٩]/g, c=>c.charCodeAt(0)-1632);
}

function isoToParts(iso){
  if(!iso) return null;
  const p = toEnglishDigits(iso).replace(/[\/\\]/g,'-').replace(/\s/g,'').split('-').map(Number);
  if(p.length!==3 || p.some(isNaN)) return null;
  return {jy:p[0], jm:p[1], jd:p[2]};
}

function partsToIso(p){
  return `${p.jy}-$
{String(p.jm).padStart(2,'0')}-${String(p.jd).padStart(2,'0')}`;
}

function isValidIsoJalali(iso){
  const p = isoToParts(iso);
  if(!p) return false;
  if(p.jy<1300 || p.jy>1500 || p.jm<1 || p.jm>12) return false;
  return p.jd>=1 && p.jd<=jalaali.jalaaliMonthLength(p.jy, p.jm);
}

function today(){
  const d = new Date();
  const j = jalaali.toJalaali(d.getFullYear(), d.getMonth()+1, d.getDate());
  return partsToIso(j);
}

function faDate(iso){
  if(!iso) return '—';
  const p = isoToParts(iso);
  if(!p) return iso;
  return `${p.jd} ${persianMonths[p.jm-1]} ${p.jy}`;
}

function getJalaliDayOfWeek(iso){
  const p = isoToParts(iso);
  if(!p) return -1;
  const g = jalaali.toGregorian(p.jy, p.jm, p.jd);
  return (new Date(g.gy, g.gm-1, g.gd).getDay()+1)%7;
}

function isHallHoliday(dow){ return dow === 6; } // جمعه

// back-compat
const getJalaliParts = isoToParts;

function getYearRange(){
  let curJy=getJalaliParts(today()).jy;
  return {minY:Math.min(curJy-1,1403), maxY:curJy+10};
}

function shiftJalaliMonth(d){
  let y=+document.getElementById('calYear').value;
  let m=+document.getElementById('calMonth').value+d;
  if(m<1){ m=12; y--; }
  if(m>12){ m=1; y++; }
  let {minY,maxY}=getYearRange();
  y=Math.max(minY,Math.min(maxY,y));
  document.getElementById('calYea
r').value=y;
  document.getElementById('calMonth').value=m;
  renderCalendarMonth();

function renderCalendarMonth(){
  const el=document.getElementById('calBody');
  if(!el) return;
  const jy=+document.getElementById('calYear').value;
  const jm=+document.getElementById('calMonth').value;
  const daysInMonth=jalaali.jalaaliMonthLength(jy,jm);
  
  const g = jalaali.toGregorian(jy, jm, 1);
  const firstDayObj = new Date(g.gy, 
g.gm - 1, g.gd);
  const firstDayOfWeek = (firstDayObj.getDay() + 1) % 7;
  
  const todayIso = today();
  const weekDays = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];

  let html = '<div class="cal-table-wrap"><table class="cal-table"><thead><tr>';
  html += weekDays.map(n=>`<th>${n}</th>`).join('');
  html += '</tr></thead><tbody><tr>';

  for(let i=0; i<firstDayOfWeek; i++){
    html += '<td class="cal-empty"></td>';
  }

  for(let d=1; d<=daysInMonth; d++){
    const iso = `${jy}-${String(jm).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const currentDow = (firstDayOfWeek + d - 1) % 7;
    const isFriday = currentDow === 6; 
    const isToday = iso === todayIso;
    const rs = db.reservations.filter(r => r.date === iso && ['approved','confirmed','done'].includes(r.status));

    let cls = 'cal-day-cell';
    if(isToday) cls += ' today';
    if(isFriday) cls += ' holiday';

    html += `<td class="${cls}">
      <div class="cal-day-num">${d}</div>
      <div class="cal-events">
        ${rs.map(r => `<div class="cal-event" title="${esc(r.title)}">${esc(r.title)}</div>`).join('')}
      </div>
    </td>`;

    if((firstDayOfWeek + d) % 7 === 0 && d !== daysInMonth){
      html += '</tr><tr>';
    }
  }

  const remaining = (7 - 
((firstDayOfWeek + daysInMonth) % 7)) % 7;

function overlap(a,b){return 
a.start<b.end&&b.start<a.end}
function timeToMinutes(t){
  const m=/^(\d{1,2}):(\d{2})$/.exec(String(t||'').trim());
  if(!m) return NaN;
  const h=+m[1],min=+m[2];
  if(h>23||min>59) return NaN;
  return h*60+min;
}
function minutesToTime(mins){
  mins=Math.max(0,Math.min(1439,Math.floor(mins)));
  return String(Math.floor(mins/60)).padStart(2,'0')+':'+String(mins%60).padStart(2,'0');
}

  save();shell();

  const inUse=db.reservations.some(r=>

    if(r.equipment&&Array.isArray(r.equipment)){

<script>

function reportRows(){

  let s=document.getElementById('rs')?.value||'';
  f = f ? toEnglishDigits(f).replace(/\//g,'-') : '';
  t = t ? toEnglishDigits(t).replace(/\//g,'-') : '9999';
  return db.reservations.filter(
r=>r.date>=f&&r.date<=t&&(!h||r.hallId===+h)&&(!s||r.status===s)).sort((a,b)=>a.date.localeCompare(b.date))
}
function runReport(){
  let rows=reportRows();
  let items=[['brand','تعداد کل',rows.length],['green','قطعی',rows.filter(r=>r.status==='confirmed').length],['amber','برگزار شده',rows.filter(r=>r.status==='done').length],['red','لغو شده',rows.filter(r=>r.status==='cancelled').length]];
  document.getElementById('reportSummary').innerHTML=items.map(([cls,l,v])=>`<div class="stat stat--${cls}"><div 
class="stat-inner"><span class="stat-label">${l}</span><span class="stat-value">${v}</span></div></div>`).join('');

function exportCSV(){let rows=reportRows();let h=['شماره','تاریخ','سانس','سالن','موضوع','واحد','مسئول','تلفن','مسئول مستقیم','مهمان شاخص','وضعیت'];let l=[h,...rows.map(r=>[r.id,faDate(r.date),slotName(r.slotId),hallName(r.hallId),r.title,r.unit,r.requester,r.phone,r.supervisor,r.guest,statusText[r.status]])];let csv='\ufeff'+l.map(row=>row.map(v=>'"'+String(v??'').replace(/"/
g,'""')+'"').join(',')).join('\r\n');downloadBlob(csv,`گزارش-رزرو-${today()}.csv`,'text/csv;charset=utf-8')}

/* ============ DATA ============ */
function dataPage(c){

th><th>جزئیات</th></tr></thead><tbody>${db.logs.slice(0,100).map(l=>`<tr><td data-label="زمان">${esc(new Date(l.at).toLocaleString('fa-IR'))}</td><td data-label="رویداد">${esc(l.action)}</td><td data-label="جزئیات">${esc(l.details)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${IC.empty}<h4>هنوز فعالیتی ثبت نشده است</h4></div>`}
    </div>
    <div class="card" style="border-color:var(--red)">
      <div class="card-head"><div class="card-title-icon" style="background:var(--red-soft);color:var(--red)">$
{IC.warn}</div><h3 style="color:var(--red)">ناحیه حساس</h3></div>
      <p style="margin-bottom:14px;color:var(--muted)">پاک‌سازی همه اطلاعات قابل بازگشت نیست. قبل از ادامه فایل پشتیبان تهیه کنید.</p>
      <button class="btn btn-danger" onclick="resetData()">${IC.trash} پاک‌کردن همه اطلاعات</button>

function downloadBlob(content,name,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;docu
ment.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function backup(){downloadBlob(JSON.stringify({format:'hall-manager-backup',version:17,exportedAt:new Date().toISOString(),data:db},null,2),`پشتیبان-رزرو-${today()}.json`,'application/json')}
function restore(ev){
  let f=ev.target.files[0];if(!f)return;
  let rd=new FileReader();
  rd.onload=()=>{
    try{
      let o=JSON.parse(rd.result),x=o.data||o;
      if(!Array.isArray(x.halls)||!Array.isArray(x.reservations)||!
Array.isArray(x.equipment)||!Array.isArray(x.slots)||!Array.isArray(x.applicants))throw new Error('ساختار فایل نامعتبر است.');
      if(!confirm('اطلاعات فعلی با محتوای فایل جایگزین شود؟'))return;
      db={...seed(),...x};if(!save())throw new Error('ذخیره ناموفق بود.');
      sanitizeDB();migrateData();autoCompletePassedReservations();toast('بازیابی با موفقیت انجام شد.','success');shell();
    }catch(e){toast('بازیابی ناموفق: '+e.message,'error')}
    finally{ev.target.value=''}
  };
  rd.readAsText(f);
}
function downloadCSVAll(){let rows=db.reservations;let l=[['شماره','تاریخ','سانس','سالن','موضوع','واحد','مسئول','تلفن','مسئول مستقیم','مهمان شاخص','وضعیت'],...rows.map(r=>[r.id,faDate(r.date),slotName(r.slotId),hallName(r.hallId),r.title,r.unit,r.requester,r.phone,r.supervisor,r.guest,statusText[r.status]])];downloadBlob('\ufeff'+l.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),`همه-رزروها-${today()}.csv`,'text/csv;charset=utf-8')}
function resetData(){
  if(!confirm('تمام اطلاعات محلی حذف و سامانه از ابتدا ساخته شود؟'))return;

<script>
'use strict';

const SESSION_KEY='hall_session_v1';
const PASSWORD_SALT='hall_manager_salt_v1';
const SESSION_TTL_MS=8*60*60*1000;
const LOGIN_ATTEMPTS_KEY='hall_login_attempts_v1';
const MAX_LOGIN_ATTEMPTS=5;
const LOGIN_LOCKOUT_MS=15*60*1000;
const MAX_PASSWORD_REQUESTS=100;

const PERMISSIONS=[
  {k:'dashboard',t:'داشبورد',i:IC.dash,adminOnly:false,desc:'نمای کلی و آمار'},

  {k:'halls',t:'مدیریت سالن‌ها',i:IC.hall,adminOnly:true,desc:'فقط مدیر (خودکار)'},
  {k:'slots',t:'سانس‌های زمانی',i:IC.clock,adminOnly:true,desc:'فقط مدیر (خودکار)'},
  {k:'equipment',t:'تجهیزات',i:IC.gear,adminOnly:true,desc:'فقط مدیر (خودکار)'},

ers,adminOnly:false,desc:'مدیریت متقاضیان'},

];

let session=null;

let _cryptoWarned=false;
function isCryptoAvailable(){
  return typeof window!=='undefined'&&window.crypto&&window.crypto.subtle&&typeof window.crypto.subtle.digest==='function';
}
async function hashPassword(password){
  if(isCryptoAvailable()){
    try{
      const encoder=new TextEncoder();
      const data=encoder.encode(password+PASSWORD_SALT);
      const hash=await crypto.subtle.digest('SHA-256',data);
      return Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }catch(e){}
  }
  if(!_cryptoWarned){
    _cryptoWarned=true;
    console.error('[Security] Web 
Crypto API در دسترس نیست! استفاده از fallback ضعیف.');
    if(typeof toast==='function'){
      toast('⚠ هشدار امنیتی: مرورگر از Web Crypto پشتیبانی نمی‌کند.','warning',8000);
    }
  }
  let h1=0xdeadbeef^0x19a8e4b9,h2=0x41c6ce57^0x2b91d3a5;
  const str=password+PASSWORD_SALT;
  for(let i=0;i<str.length;i++){
    const ch=str.charCodeAt(i);
    h1=Math.imul(h1^ch,2654435761);
    h2=Math.imul(h2^ch,1597334677);
  }
  h1=h1^(h1>>>16);h2=h2^(h2>>>16);
  return 'fallback_'+(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0');
}

function getLoginAttempts(username){
  try{
    const all=JSON.parse(localStorage.getItem(LOGIN_ATTEMPTS_KEY)||'{}');
    const k=username.toLowerCase();
    const attempts=all[k]||[];
    const now=Date.now();
    return attempts.filter(t=>now-t<L
OGIN_LOCKOUT_MS);
  }catch(e){return []}
}
function recordFailedLoginAttempt(username){
  try{
    const all=JSON.parse(localStorage.getItem(LOGIN_ATTEMPTS_KEY)||'{}');
    const k=username.toLowerCase();
    if(!all[k])all[k]=[];
    const now=Date.now();
    all[k]=all[k].filter(t=>now-t<LOGIN_LOCKOUT_MS);
    all[k].push(now);
    localStorage.setItem(LOGIN_ATTEMPTS_KEY,JSON.stringify(all));
  }catch(e){}
}
function clearLoginAttempts(username){
  try{
    const all=JSON.parse(localStorage.getItem(LOGIN_ATTEMPTS_KEY)||'{}');
    delete all[username.toLowerCase()];
    localStorage.setItem(LOGIN_ATTEMPTS_KEY,JSON.stringify(all));
  }catch(e){}
}
function getLockoutRemaining(username){
  const attempts=getLoginAttempts(username);
  if(attempts.length<MAX_
LOGIN_ATTEMPTS) return 0;
  const oldest=attempts[0];
  const elapsed=Date.now()-oldest;
  const remaining=LOGIN_LOCKOUT_MS-elapsed;
  return remaining>0?Math.ceil(remaining/60000):0;
}

function generateRecoveryCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const len=12;
  let code='';
  if(window.crypto&&window.crypto.getRandomValues&&typeof Uint8Array!=='undefined'){
    const arr=new Uint8Array(len);
    window.crypto.getRandomValues(arr);
    for(let i=0;i<len;i++) code+=chars.charAt(arr[i]%chars.length);
  }else{
    console.warn('[Security] crypto.getRandomValues در دسترس نیست - fallback ضعیف');
    for(let i=0;i<len;i++) code+=chars.charAt(Math.floor(Math.random()*chars.length));
  }
  return code;
}
function formatRecoveryCode(code){
  return code.slice(0,4)+'-'+code.slice(4,8)+'-'+code.slice(8,12);
}
function normalizeRecoveryCode(input){
  return String(input||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
}

async function doLogin(){
  const form=document.querySelector('#authBody .auth-form');
  const f=new FormData(form);
  const username=String(f.get('username')).trim().toLowerCase();
  const password=String(f.get('password'));
  showAuthError('');
  if(!username||!password){
    showAuthError('نام کاربری و رمز عبور را وارد کنید.');
    return;
  }
  const lockoutRemaining=getLockoutRemaining(username);
  if(lockoutRemaining>0){
    showAuthError(`تعداد تلاش‌های ناموفق بیش از حد مجاز. لطفاً ${lockoutRemaining} دقیقه دیگر صبر 
کنید.`);
    return;
  }
  const user=db.users.find(u=>u.username.toLowerCase()===username);
  if(!user||!user.active){
    recordFailedLoginAttempt(username);
    log('ورود ناموفق',`نام کاربری: ${username} (کاربر یافت نشد یا غیرفعال)`);
    save();
    const remaining=MAX_LOGIN_ATTEMPTS-getLoginAttempts(username).length;
    showAuthError(remaining>0
      ?`نام کاربری یا رمز عبور نادرست است. تلاش‌های باقیمانده: ${remaining}`
      :`تعداد تلاش‌های ناموفق بیش از حد. حساب به مدت ۱۵ دقیقه قفل شد.`
    );
    return;
  }
  const hash=await hashPassword(password);
  if(user.passwordHash!==hash){
    recordFailedLoginAttempt(username);
    log('ورود ناموفق',`نام کاربری: ${username} (رمز نادرست)`);
    save();
    const remaining=MAX_LOGIN_ATTEMPTS-getLoginAttempts(username).length;
    showAuthError(remaining>0
      ?`نام کاربری یا رمز عبور نادرست است. تلاش‌های باقیمانده: ${remaining}`
      :`تعداد تلاش‌های ناموفق بیش از حد. حساب به مدت ۱۵ دقیقه قفل شد.`
    );
    return;
  }
  clearLoginAttempts(username);
  session={userId:user.id,loginAt:new Date().toISOString()};
  user.lastLogin=new Date().toISOString();
  localStorage.setItem(SESSION_KEY,JSON.stringify(session));
  save();
  showApp();
  toast(`خوش آمدید، ${user.name}!`,'success');
}

async function changeMyPassword(){
  const u=currentUser();
  if(!u){
    toast('برای تغییر رمز باید وارد شوید.','error');
    return;
  }
  const oldPass=prompt('رمز فعلی خود را وارد کنید:');
  if(oldPass===null) return;
  const oldHash=await hashPassword(oldPass);
  if(u.passwordHash!==oldHash){
    toast('رمز فعلی نادرست است.','error');
    return;
  }
  const newPass=prompt('رمز جدید را وارد کنید (حداقل ۶ کاراکتر):','');
  if(newPass===null) return;
  if(newPass.length<6){
    toast('رمز جدید باید حداقل ۶ کاراکتر باشد.','error');
    return;
  }
  if(newPass===oldPass){
    toast('رمز جدید نباید با رمز فعلی یکسان باشد.','error');
    return;
  }
  const confirmPass=prompt('رمز جدید را دوباره وارد کنید (تأیید):','');
  if(confirmPass===null) return;
  if(confirmPass!==newPass){
    toast('تأیید رمز با رمز جدید مطابقت ندارد.','error');
    return;
  }
  u.passwordHash=await hashPassword(newPass);
  clearLoginAttempts(u.username);
  log('تغییر رمز عبور',`توسط ${u.name}`);
  save();
  toast('رمز شما با موفقیت تغییر کرد.','success');
}

  const passwordHash=await hashPassword(String(f.get('password')));

  const admin={

function confirmRecoverySaved(formattedCode){
  if(!confirm('⚠ تأیید نهایی\n\nآیا مطمئن هستید که کد بازیابی را در محل امن ذخیره کرده‌اید؟\n\nاین کد دیگر نمایش داده نخواهد شد.')){

  showLoginScreen();

function doForgotRequest(){
  const form=document.querySelector('#authBody .auth-form');
  const f=new FormData(form);
  const identifier=String(f.get('identifier')).trim().toLowerCase();
  showAuthError('');
  if(!identifier){
    showAuthError('نام کاربری یا ایمیل را وارد کنید.');
    return;
  }
  const user=db.users.find(u=>
    (u.username.toLowerCase()===identifier||u.email.toLowerCase()===identifier)
  );
  if(!user){
    showAuthError('کاربری با این مشخصات یافت نشد. با مدیر تماس بگیرید.');
    return;
  }
  if(!user.active){
    showAuthError('این حساب غیرفعال است. با مدیر تماس بگیرید.');
    return;
  }
  if(!Array.isArray(db.passwordRequests)) db.passwordRequests=[];
  const req={
    id:uid(db.passwordRequests),
    userId:user.id,
    userName:user.name,
    userIdentifier:identifier,
    requestedAt:new Date().toISOString(),
    status:'pending',
    resolvedAt:null,
    adminNotes:''
  };
  db.passwordRequests.unshift(req);
  if(db.passwordRequests.length>MAX_PASSWORD_REQUESTS){
    db.passwordRequests=db.passwordRequests.slice(0,MAX_PASSWORD_REQUESTS);
  }
  log('درخواست بازنشانی رمز',`کاربر: ${user.name} (${identifier})`);
  save();
  document.getElementById('authBody').innerHTML=`
    <div class="auth-success-notice">$
{IC.check}<div>درخواست شما با موفقیت به مدیر سامانه ارسال شد.<br>پس از تأیید مدیر، رمز جدید به شما اطلاع داده خواهد شد.</div></div>
    <button class="btn btn-primary" style="width:100%;padding:12px" onclick="showLoginScreen()">بازگشت به صفحه ورود</button>
  `;
}

function logout(){

  localStorage.removeItem(SESSION_KEY);
  session=null;
  view='dashboard';
  document.getElementById('authSc
reen').classList.remove('hidden');
  showLoginScreen();
  toast('از سامانه خارج شدید.','info');
}

function showApp(){
  document.getElementById('authScreen').classList.add('hidden');

  shell();
}

async function addUser(){
  const form=event.target;
  if(!form.checkValidity()){form.reportValidity();return}
  const f=new FormData(form);
  const username=String(f.get('username')||'').trim().toLowerCase();
  const email=String(f.get('email')||'
').trim().toLowerCase();
  const name=String(f.get('name')||'').trim();
  if(!name) return toast('نام و نام خانوادگی الزامی است.','error');
  if(!username) return toast('نام کاربری الزامی است.','error');
  if(!email) return toast('ایمیل الزامی است.','error');
  if(db.users.some(u=>u.username.toLowerCase()===username)){
    toast('این نام کاربری قبلاً ثبت شده است.','error');
    return;
  }
  if(db.users.some(u=>u.email.toLowerCase()===email)){
    toast('کاربری با این ایمیل قبلاً ثبت شده است. ایمیل باید یکتا باشد.','error');
    return;
  }
  const passwordHash=await hashPassword(String(f.get('password')));
  const u={
    id:uid(db.users),
    name:name,
    username:username,
    email:email,
    passwordHash:passwordHash,
    role:'user',
    permissions:['dashboard','calendar','reservations','new','reports'],
    active:true,
    createdAt:new Date().toISOString(),
    lastLogin:null
  };
  db.users.push(u);
  log('افزودن کاربر',`${u.name} (${u.username})`);
  save();
  toast('کاربر افزوده شد. اکنون می‌توانید دسترسی‌های او را تنظیم کنید.','success');
  shell();
}

function promoteToAdmin(id){
  const u=db.users.find(x=>x.id===id);
  if(!u) return;
  if(u.role==='admin'){
    toast('این کاربر از قبل مدیر است.','warning');
    return;
  }
  if(!u.active){
    if(!confirm(`کاربر «${u.name}» غیرفعال است. برای ارتقا به مدیر، ابتدا باید فعال شود. آیا فعال و به مدیر ارتقا داده شود؟`)) return;
    u.active=true;
  }else{
    if(!confirm(`تفویض نقش مدیر به «${u.name}»؟\n\nاین کاربر به تمام ماژول‌ها و مدیریت کاربران دسترسی خواهد داشت.\n\nادامه می‌دهید؟`)) return;
  }
  u.role='admin';
  u.permissions=[];
  log('تفویض نقش مدیر',u.name);
  save();
  toast(`${u.name} به مدیر ارتقا یافت.`,'success');
  shell();
}

function demoteFromAdmin(id){
  const u=db.users.find(x=>x.id===id);
  if(!u) return;
  if(u.role!=='admin') return;
  const me=currentUser();
  if(u.id===me.id){
    toast('نمی‌توانید سطح خودتان را کاهش دهید. ابتدا شخص دیگری را مدیر کنید.','error');
    return;
  }
  const activeAdmins=db.users.filter(x=>x.role==='admin'&&x.active);
  if(activeAdmins.length<=1){
    toast('نمی‌توانید تنها مدیر فعال را کاهش دهید. حداقل یک مدیر باید باقی 
بماند.','error');
    return;
  }
  if(!confirm(`کاهش سطح مدیر «${u.name}» به کاربر عادی؟\n\nاین کاربر دسترسی به مدیریت کاربران و ماژول‌های مدیر-تنها را از دست خواهد داد.\n\nادامه می‌دهید؟`)) return;
  u.role='user';
  u.permissions=['dashboard','calendar','reservations','new','reports'];
  log('سلب نقش مدیر',u.name);
  save();
  toast(`${u.name} به کاربر عادی تقلیل یافت.`,'success');
  shell();
}

    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(formatted).then(()=>toast('کد کپی شد.','success')).catch(()=>toast('کپی ناموفق بود.','warning'));

  if(username===null) return;
  if(!name.trim()||!email.trim()||!username.trim()){
    toast('اطلاعات نامعتبر است.','error');
    return;
  }
  if(db.users.some(x=>x.id!==id&&x.username.toLowerCase()===username.trim().toLowerCase())){
    toast('این نام کاربری قبلاً ثبت شده است.','error');
    return;
  }
  if(db.users.some(x=>x.id!==id&&x.email.toLowerCase()===email.trim().toLowerCase())){
    toast('کاربری با این ایمیل قبلاً ثبت شده است.','error');
    return;
  }
  u.name=name.trim();
  u.email=email.trim().toLowerCase();
  u.username=username.trim().toLowerCase();
  save();
  toast('اطلاعات کاربر به‌روزرسانی شد.','success');
  shell();
}

<!-- ============ اتصال به Supabase ============ -->
<script>
(function() {
  'use strict';

  const SUPABASE_URL = (function(){
    try { return localStorage.getItem('hall_supabase_url') || 'https://fbmzbanvvsshmoypqejh.supabase.co'; }
    catch(e) { return 'https://fbmzbanvvsshmoypqejh.supabase.co'; }
  })();
  const SUPABASE_KEY = (function(){
    try { return localStorage.getItem('hall_supabase_key') || 'sb_publishable_0BqGoQOkYbT2jHsm8-nxrQ_2q6CSWQl'; }
    catch(e) { return 'sb_publishable_0BqGoQOkYbT2jHsm8-nxrQ_2q6CSWQl'; }
  })();

  const TABLE_NAME = 'salon_data';
  const ROW_ID = 1;
  const SYNC_DELAY_MS = 800;

  let supabaseClient = null;
  let cloudSyncReady = false;
  let lastSyncAt = null;
  let pendingSync = null;

  function setSyncStatus(state, text) {
    const badge = document.getElementById('syncBadge');
    const txt = document.getElementById('syncText');
    if (!badge || !txt) return;
    badge.classList.remove('online','offline','syncing');
    badge.classList.add(state);
    txt.textContent = text;
  }

  try {
    if (SUPABASE_URL && SUPABASE_KEY &&
        !SUPABASE_URL.includes('YOUR_') && !SUPABASE_KEY.includes('YOUR_') &&
        typeof window.supabase !== 'undefined') {
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      window.SupabaseConfigured = true;
      setSyncStatus('syncing', 'در حال اتصال...');
      console.log('%c[Supabase] راه‌اندازی شد - سینک ابری فعال', 'color:#10b981;font-weight:bold');
    } else {
      window.SupabaseConfigured = false;
      setSyncStatus('offline', 'محلی');
      console.log('%c[Supabase] اعتبارنامه تنظیم نشده - حالت محلی', 'color:#f59e0b');
    }
  } catch (e) {
    window.SupabaseConfigured = false;
    setSyncStatus('offline', 'خطای اتصال');
    console.error('[Supabase] خطای راه‌اندازی:', e);
  }

  if (!supabaseClient) return;

  async function syncToCloud() {
    if (!cloudSyncReady) return;
    if (pendingSync) clearTimeout(pendingSync);
    pendingSync = setTimeout(async () => {
      setSyncStatus('syncing', 'در حال سینک...');
      const writeToken = localStorage.getItem('hall_write_token') || 'salon_secret_1403';
      try {
        const { error } = await supabaseClient.rpc('secure_upsert_salon', { secret_token: writeToken, data_payload: db });
        if (error) {
          console.error('[Supabase] خطای آپلود:', error.message);
          if (error.message.includes('Unauthorized')) { setSyncStatus('offline', 'توکن نامعتبر'); }
          else if (error.message.includes('does not exist')||error.message.includes('function')) { setSyncStatus('offline', 'RPC یافت نشد'); if(!window._rpcWarned){window._rpcWarned=true;toast('⚠ SQL را در Supabase اجرا کنید.','error',10000);} }
          else { setSyncStatus('offline', 'خطای سینک'); }
        } else { lastSyncAt = new Date(); setSyncStatus('online', 'آنلاین'); window._rpcWarned=false; }
      } catch (e) { console.error('[Supabase] استثنای آپلود:', e); setSyncStatus('offline', 'خطای شبکه'); }
    }, 300);
  }

  async function syncFromCloud() {
    try {
      const { data, error } = await supabaseClient
        .from(TABLE_NAME)
        .select('json_data,updated_at')
        .eq('id', ROW_ID)
        .maybeSingle();

      if (error) {
        console.log('[Supabase] خطا:', error.message);
        return 'error';
      }

      if (data && data.json_data && Array.isArray(data.json_data.reservations)) {
        const cloudData = data.json_data;
        const cloudHasUsers = Array.isArray(cloudData.users) && cloudData.users.length > 0;
        const localHasUsers = Array.isArray(db.users) && db.users.length > 0;
        const cloudUpdatedAt = cloudData._localUpdatedAt || data.updated_at || '1970-01-01T00:00:00Z';
        const localUpdatedAt = db._localUpdatedAt || '1970-01-01T00:00:00Z';
        const cloudIsNewer = new Date(cloudUpdatedAt) > new Date(localUpdatedAt);

        if (localHasUsers && !cloudHasUsers) {
          console.warn('[Supabase] ابر بدون کاربر است ولی محلی کاربر دارد - از بازنویسی خودداری شد');
          cloudSyncReady = true;
          await syncToCloud();
          return 'pushed';
        }

        if (cloudIsNewer) {
          db = cloudData;
          migrateData();
          autoCompletePassedReservations();
          const REQ_ARRAYS=['halls','equipment','checks','issues','units','logs','slots','applicants','users','passwordRequests'];
          for(const k of REQ_ARRAYS){
            if(!Array.isArray(db[k])) db[k]=seed()[k]||[];
          }
          try { localStorage.setItem(KEY, JSON.stringify(db)); } catch(e) {}

          if (typeof session !== 'undefined' && session) {
            const u = db.users.find(x => x.id === session.userId);
            if (!u || !u.active) {
              try { localStorage.removeItem('hall_session_v1'); } catch(e) {}
              session = null;
              view = 'dashboard';
              if(window.CloudSyncComplete){
                if(typeof showLoginScreen === 'function'){
                  document.getElementById('authScreen').classList.remove('hidden');
                  showLoginScreen();
                }
                toast('نشست شما به‌روزرسانی شد. دوباره وارد شوید.', 'warning');
              }
              return 'loaded';
            }
            if(window.CloudSyncComplete && typeof shell === 'function'){
              shell();
            }
          }
          console.log('%c[Supabase] داده‌ها از کلود بارگذاری شد', 'color:#10b981;font-weight:bold');
          return 'loaded';
        } else {
          console.log('[Supabase] محلی جدیدتر از کلود - push می‌شود');
          cloudSyncReady = true;
          await syncToCloud();
          return 'pushed';
        }
      }
      console.log('[Supabase] هنوز ردیفی 
در جدول وجود ندارد - اولین بار است');
      return 'none';
    } catch (e) {
      console.error('[Supabase] استثنای بارگذاری:', e);
      return 'error';
    }
  }

  if (typeof window.save === 'function') {
    const _originalSave = window.save;
    window.save = function() {
      const result = _originalSave.apply(this, arguments);
      syncToCloud();
      return result;
    };
    console.log('%c[Supabase] تابع save بسته‌بندی شد', 'color:#3b82f6');
  }

  window.manualSync = async function() {
    if (!supabaseClient) {
      toast('اتصال به دیتابیس فعال نیست. ابتدا اعتبارنامه Supabase را تنظیم کنید.', 'warning');
      return;
    }
    setSyncStatus('syncing', 'سینک دستی...');
    const result = await syncFromCloud();
    if (result === 'loaded') {
      toast('داده‌ها از دیتابیس ابری بارگذاری 
شد.', 'success');
    } else if (result === 'pushed') {
      toast('داده‌های محلی به دیتابیس ابری آپلود شد (محلی جدیدتر بود).', 'success');
    } else if (result === 'none') {
      toast('داده‌ای در دیتابیس ابری یافت نشد. برای آپلود، دوباره سینک بزنید.', 'info');
      cloudSyncReady = true;
      await syncToCloud();
    } else {
      toast('خطا در سینک با دیتابیس ابری. بعداً دوباره تلاش کنید.', 'error');
    }
  };

  setTimeout(async () => {
    try {
      const loaded = await syncFromCloud();
      cloudSyncReady = true;
      window.CloudSyncComplete = true;
      setSyncStatus('online', 'آنلاین');

      if (window._authDecisionPending && typeof decideAuthScreen === 'function') {
        decideAuthScreen();
      }

      if (loaded === 'none') {
        await syncToCloud();
      } else if (loaded === 'error') {
        toast('اتصال به دیتابیس ابری برقرار نشد. داده‌ی محلی استفاده می‌شود.', 'warning', 4000);
      } else {
        toast('اتصال به دیتابیس ابری برقرار شد.', 'success', 2000);
      }
    } catch (e) {
      console.error('[Supabase] استثنای سینک اولیه:', e);
      cloudSyncReady = true;
      window.CloudSyncComplete = true;
      setSyncStatus('offline', 'خطای اتصال');
      if (window._authDecisionPending && typeof decideAuthScreen === 'function') {
        decideAuthScreen();
      }
    }
  }, SYNC_DELAY_MS);

  setInterval(async () => {
    if (!cloudSyncReady) return;
    try {
      const { data } = await supabaseClient
        .from(TABLE_NAME)
        .select('updated_at')
        .eq('id', ROW_ID)
        .maybeSingle();
      if (data && data.updated_at) {
        const cloudTime = new Date(data.updated_at).getTime();
        if (!lastSyncAt || cloudTime > lastSyncAt.getTime()) {
          await syncFromCloud();
        }
      }
    } catch (e) {}
  }, 30000);

})();
</script>
